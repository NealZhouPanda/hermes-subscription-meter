name: subscription-meter
kind: standalone
version: 0.3.0
description: "Subscription quota dashboard — per-provider show/hide from the UI; plans render as 84 cells, account rows show balance."
provides_tools: []
config_schema:
  visibility:
    type: dict
    description: Per-provider display switch (provider id -> whether the row shows in the quota dashboard).
  monthlyVisibility:
    type: dict
    description: Per-provider monthly quota switch (default on when a monthly window is detected; explicit false hides it).
