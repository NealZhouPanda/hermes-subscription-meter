# Provider identity matchers for hermes-subscription-meter.
#
# Add or correct a key prefix / OAuth host / env slot / ledger key here and
# open a PR. You do not need to change Python unless the provider also needs
# a fetch adapter (those stay in dashboard/plugin_api.py).
#
# Detect order is implemented in code, not in this file:
#   1. key prefix (longest match wins)
#   2. OAuth host id
#   3. env-slot weak prior
#   4. ledger env name
#
# An id with no fetch adapter still loads; the meter shows it as no_fetcher.
# Unknown keys, missing fields, or a missing file fail at import — there is
# no in-code fallback table.

providers:
  - id: anthropic
    shareable: false
    matchers:
      prefixes:
        - prefix: sk-ant-oat
          kind: quota
          label: ANTHROPIC
        - prefix: sk-ant-
          kind: quota
          label: ANTHROPIC
      oauth: []
      env_slots: []
      ledger_env: []
      label_kind:
        label: ANTHROPIC
        kind: quota
    meta:
      accent: "#8F3224"
      # Per-theme brand accent: `accent` = light theme, `accentDark` = dark theme.
      # Brand hue is kept; only lightness shifts, and only on the theme where the
      # brand colour would not read (supplier accents are decorative, so the only
      # rule is legibility on that theme: 4.5:1, since name and amount are small
      # text). Pinned by tests/test_identity_accents.py.
      accentDark: "#C4604D"

  - id: openrouter
    shareable: false
    matchers:
      prefixes:
        - prefix: sk-or-
          kind: balance
          label: OPENROUTER
      oauth: []
      env_slots: []
      # Hermes 的供应商登记（PROVIDER_REGISTRY 的 env 槽位表）里没有 OpenRouter ——
      # 它是路由型 provider，走的是 config.yaml 的 provider 名而非登记条目，所以发现层
      # 拿不到这把 key，行在设置页/看板上根本不会出现。ledger_env 是「env 名即身份」的
      # 登记槽（与 xai 的 XAI_MANAGEMENT_API_KEY 同理），补上它候选才会产生。
      ledger_env:
        - OPENROUTER_API_KEY
      label_kind:
        label: OPENROUTER
        kind: balance
    meta:
      accent: "#4900FA"
      # Per-theme brand accent: `accent` = light theme, `accentDark` = dark theme.
      # Brand hue is kept; only lightness shifts, and only on the theme where the
      # brand colour would not read (supplier accents are decorative, so the only
      # rule is legibility on that theme: 4.5:1, since name and amount are small
      # text). Pinned by tests/test_identity_accents.py.
      accentDark: "#915BF8"

  - id: kimi
    shareable: false
    matchers:
      prefixes:
        - prefix: sk-kimi-
          kind: quota
          label: KIMI
      oauth: []
      env_slots:
        - KIMI_API_KEY
        - KIMI_CODING_API_KEY
        - KIMI_CN_API_KEY
      ledger_env: []
