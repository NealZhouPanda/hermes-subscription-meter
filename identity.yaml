      accentDark: "#7D65F7"
      credentials:
        # 余额只认这把 API key；消费明细走第二个接口，要网页登录态里的 userToken。
        optional: "DEEPSEEK_PLATFORM_TOKEN — adds today / 7-day / 30-day spend"
      peakHours:
        timezone: "+08:00"
        daily: false
        windows:
          - [540, 720]
          - [840, 1080]

