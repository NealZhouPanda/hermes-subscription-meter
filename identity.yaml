# Provider identity matchers for hermes-subscription-meter.
#
# Add or correct a key prefix / OAuth host / env slot / ledger key here and
# open a PR. You do not need to change Python unless the provider also needs
# a fetch adapter (those stay in dashboard/plugin_api.py).
#
# Detect order is implemented in code, not in this file:
#   1. key prefix (longest match wins)
#   2. OAuth host id
#   3. env-slot weak prior
#   4. ledger env name
#
# An id with no fetch adapter still loads; the meter shows it as no_fetcher.
# Unknown keys, missing fields, or a missing file fail at import — there is
# no in-code fallback table.

providers:
  - id: anthropic
    shareable: false
    matchers:
      prefixes:
        - prefix: sk-ant-oat
          kind: quota
          label: ANTHROPIC
        - prefix: sk-ant-
          kind: quota
          label: ANTHROPIC
      oauth: []
      env_slots: []
      ledger_env: []
      label_kind:
        label: ANTHROPIC
        kind: quota
    meta: {}

  - id: openrouter
    shareable: false
