      accentDark: "#D4541F"
      credentials:
        # 余额要阿里云 AccessKey，不是 DashScope 的推理 key。
        requires: "ALIBABA_CLOUD_ACCESS_KEY_ID + ALIBABA_CLOUD_ACCESS_KEY_SECRET"

